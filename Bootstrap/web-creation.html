<!DOCTYPE html>
<html>

<head>
    <title>Susan's Restaurant</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #333333;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-size: 18px;
        }

        .navbar a:hover {
            color: orange;
        }

        .logo {
            color: orange;
            font-size: 22px;
            font-weight: bold;
            margin-right: 40px;
        }

        .banner {
            background-image: url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?q=80&w=1600');
            background-size: cover;
            background-position: center;
            height: 400px;
            text-align: center;
            color: white;
            padding-top: 130px;
        }

        .banner h1 {
            font-size: 40px;
            margin: 0;
        }

        .banner p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="#" class="logo">Susan's Restaurant</a>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <div class="banner">
        <h1>Welcome to Susan's Restaurant</h1>
        <p>Good food. Good people. Good times.</p>
    </div>

</body>

</html>
