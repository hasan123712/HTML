<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

    <script src="https://kit.fontawesome.com/996973c893.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
        rel="stylesheet" />

    <title>Navigation bar</title>

    <style>
        body {

            margin: 0;

            font-family: "Baloo Tamma 2", sans-serif;

            background: #fff;

        }

        /* Full width navbar */

        .navigation {

            background: #222;

            border-top: 2px solid #f2a900;

            padding: 12px 40px !important;

        }

        /* Logo */

        .brand-logo {

            height: 26px;

            width: auto;

        }

        /* Links */

        .navigation-link {

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;

            color: #fff !important;

        }

        .navigation-link:hover {

            color: #f2a900 !important;

        }
    </style>
</head>

<body>
    <div class="container-fluid navigation pt-3">
        <div class="row">
            <div class="col-6 d-flex justify-content-start align-items-center">
                <i class="fas fa-code fa-2x text-warning pb-3"></i>
                <h5 class="d-inline pl-2 text-white">youtube</h5>
            </div>
            <div class="col-6 pt-2">
                <div class="row text-center p-0 d-flex justify-content-end align-items-center">
                    <div class="col-3">
                        <a href="#about" class="text-white navigation-link">About</a>
                    </div>
                    <div class="col-3">
                        <a href="#projects" class="text-white navigation-link">Project</a>
                    </div>
                    <div class="col-3">
                        <a href="#social-media" class="text-white-center navigation-link">Social-media</a>
                    </div>
                    <div class="col-3">
                        <a href="https://www.youtube.com/" class="text-white-center navigation-link">Youtube</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
