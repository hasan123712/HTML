<!DOCTYPE html>

<head>

    <title>about</title>





    <style>
        body{

        .btn-outline-warning:hover{

<div id="about" class="container about p-5">
    <div class="row">

         </div>
         <div class="col-6 pl-5 pt-5 pb-5 text-white">
            <h3 class="text-warning">About BMW M1</h3>
            <h1 class="m-heading">A little bit about me</h1>
            <p>
                <b class="text-warning">I</b> am on a mission to finish all my codingal projects by tomorrow
            </p>
            <button class="btn-outline-warning">more</button>
         </div>
    </div>
</div>

</html>
