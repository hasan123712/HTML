<!DOCTYPE html>

<head>
    <title>first form</title>
</head>
<body>
   <form>

     <input type="checkbox"> Paris
      <input type="checkbox"> Tronto
       <input type="checkbox"> Berlin
       
</form> 
</body>
</html>
