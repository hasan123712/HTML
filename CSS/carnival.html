<!DOCTYPE html>

<head>
    <style>
        body{
            background-color: fuchsia;

        }
        .wheel{
            width: 200px;
            height: 200px;
            background-color: gold;
            margin: 50px;
            transform: rotate(45deg);
            border-radius: 50%;

        }
        .tent{
            width: 200px;
            height: 200px;
            background-color: chartreuse;
            margin: 50px;
            transform: scale(1.2);
        }
    </style>
    <title>wheel</title>
</head>
<body>
    <div class="wheel"></div>
    <div class="tent"></div>
</body>
</html>
