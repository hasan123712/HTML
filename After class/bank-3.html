<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Heera's Bank App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .app-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 320px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.15);
        }

        .app-title {
            text-transform: uppercase;
            color: #1a1a1a;
            margin-top: 0;
        }

        .label {
            text-decoration: underline;
            font-weight: bold;
            color: #444444;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input[type="number"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        .btn-credit {
            background-color: #28a745;
            box-shadow: 0px 4px 8px rgba(40, 167, 69, 0.4);
        }

        .btn-debit {
            background-color: #dc3545;
            box-shadow: 0px 4px 8px rgba(220, 53, 69, 0.4);
        }

        #message {
            color: #d9534f;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="app-card">
        <h1 class="app-title">Heera's Bank</h1>

        <p class="label">Current Balance:</p>
        <h2>$<span id="balance">1000</span></h2>

        <p class="label">Amount:</p>
        <input type="number" id="amount" placeholder="Enter amount">

        <div class="actions">
            <button id="credit-btn" class="btn btn-credit">Credit</button>
            <button id="debit-btn" class="btn btn-debit">Debit</button>
        </div>

        <!-- Area to display error/status messages -->
        <p id="message"></p>
    </div>

    <script>
        // ===================================================
        // PART 1: Four helper functions (read/write balance & amount)
        // ===================================================

        // 1. Read balance
        function getBalance() {
            return Number(document.getElementById("balance").innerText);
        }

        // 2. Write balance
        function setBalance(newBalance) {
            document.getElementById("balance").innerText = newBalance;
        }

        // 3. Read amount
        function getAmount() {
            return Number(document.getElementById("amount").value);
        }

        // 4. Write/Clear amount input
        function setAmount(value) {
            document.getElementById("amount").value = value;
        }


        // ===================================================
        // PART 2 & 4: Credit button logic
        // ===================================================
        var creditBtn = document.getElementById("credit-btn");
        var messageEl = document.getElementById("message");

        creditBtn.addEventListener("click", function () {
            var rawInput = document.getElementById("amount").value;
            var amount = getAmount();
            var currentBalance = getBalance();

            // PART 4: Refuse empty amount, or zero or less using if / else if / else
            if (rawInput === "") {
                messageEl.innerText = "Please enter an amount.";
            } else if (amount <= 0) {
                messageEl.innerText = "Amount must be greater than zero.";
            } else {
                var newBalance = currentBalance + amount;
                setBalance(newBalance);
                setAmount("");
                messageEl.innerText = ""; // Clear error message
            }
        });


        // ===================================================
        // PART 3, 4 & 5: Debit button logic
        // ===================================================
        var debitBtn = document.getElementById("debit-btn");

        debitBtn.addEventListener("click", function () {
            var rawInput = document.getElementById("amount").value;
            var amount = getAmount();
            var currentBalance = getBalance();

            // PART 4: Refuse empty amount, or zero or less using if / else if / else
            if (rawInput === "") {
                messageEl.innerText = "Please enter an amount.";
            } else if (amount <= 0) {
                messageEl.innerText = "Amount must be greater than zero.";
            } else {
                // PART 5: Refuse a debit larger than the balance using if
                if (amount > currentBalance) {
                    messageEl.innerText = "Debit cannot exceed current balance.";
                } else {
                    var newBalance = currentBalance - amount;
                    setBalance(newBalance);
                    setAmount("");
                    messageEl.innerText = ""; // Clear error message
                }
            }
        });
    </script>

</body>

</html>
